
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: incapacidades-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incapacidades
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: incapacidades-redis
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (OPCIONAL - Solo si STORAGE_BACKEND=minio)
  minio:
    image: minio/minio:latest
    container_name: incapacidades-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles:
      - minio  # Solo se levanta con: docker-compose --profile minio up

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: incapacidades-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5682:5672"
      - "15682:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incapacidades-api
    env_file:
      - .env
    ports:
      - "8010:8000"
    volumes:
      - .:/app
      - ./storage:/app/storage  # Volumen para filesystem storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # minio removido de depends_on (es opcional)
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incapacidades
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: filesystem  # Usar filesystem por defecto
      FILESYSTEM_BASE_PATH: /app/storage
      STORAGE_ENDPOINT: minio:9000  # Para cuando se use MinIO
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incapacidades-celery-worker
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage  # Volumen para filesystem storage
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incapacidades
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: filesystem
      FILESYSTEM_BASE_PATH: /app/storage
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incapacidades-celery-beat
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5442/incapacidades
      REDIS_URL: redis://redis:6389/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6389/1
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # Flower (Celery monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incapacidades-flower
    env_file:
      - .env
    ports:
      - "5565:5555"
    depends_on:
      - redis
      - rabbitmq
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6389/1
    command: celery -A app.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
